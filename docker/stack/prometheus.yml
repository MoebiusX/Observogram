# Prometheus scrape config for the disposable validation stack
# (docker/stack.compose.yaml). Every product in the stack is scraped so the
# alias table's `requires` names can be checked against a real exposition
# AND queried through a real PromQL engine. Never production.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/prometheus.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']
  - job_name: victoriametrics
    static_configs:
      - targets: ['victoriametrics:8428']
  - job_name: vmalert
    static_configs:
      - targets: ['vmalert:8880']
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888']
  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']
  - job_name: blackbox-exporter
    static_configs:
      - targets: ['blackbox-exporter:9115']
  # Synthetic probes through the blackbox exporter so `probe_success` exists.
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://grafana:3000/api/health
          - http://alertmanager:9093/-/healthy
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
  - job_name: promtail
    static_configs:
      - targets: ['promtail:9080']
  - job_name: jaeger
    static_configs:
      - targets: ['jaeger:14269']
