name: ci

# Validates every push to develop/main and every PR into develop or main.
# Runtime deps are installed with `npm ci` (express is a dependency).

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Pinned backend-validator binaries (promtool / amtool /
      # otelcol-contrib) — cached by the pin versions baked into the
      # fetch script, so the ~300MB download happens once per bump.
      - name: Cache backend validators
        uses: actions/cache@v6
        with:
          path: .tools
          key: validators-${{ runner.os }}-${{ hashFiles('tools/fetch-validators.mjs') }}

      - name: Fetch backend validators (pinned, sha256-verified)
        run: npm run fetch-validators

      - name: Audit runtime dependencies (high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint fetcher (node --check)
        run: npm run lint:fetcher

      - name: Lint adapter (node --check)
        run: npm run lint:adapter

      - name: Lint server (node --check)
        run: npm run lint:server

      - name: Lint studio client (node --check)
        run: npm run lint:studio

      - name: Lint CLI dispatcher (node --check)
        run: npm run lint:cli

      - name: Lint ZIP writer (node --check)
        run: npm run lint:zip

      - name: ESLint (correctness rules; warnings allowed, errors fail)
        run: npm run lint

      - name: Verify vendored spec checksums
        run: npm run sync-spec:check

      - name: Verify VENDOR-MANIFEST.json is in sync (tools/gen-vendor-manifest.mjs)
        run: npm run vendor-manifest:check

      - name: Validate canonical example against the vendored spec schema (tools/lib/validator.mjs SPEC_VERSION)
        run: npm run validate

      - name: Backend validation — strict (promtool / amtool / otelcol-contrib)
        run: npm run test:backend:strict

      # bash -eo pipefail (named, so tee cannot hide the suites' exit), the
      # TAP to a file for the summary at the end of this log, a step timeout
      # under the job's so the summary still runs on a hang.
      - name: Regression suites + coverage (adapt / fetch / packs / compile / profiles / crawl / server)
        id: test
        shell: bash
        timeout-minutes: 6
        run: npm run coverage 2>&1 | tee "$RUNNER_TEMP/test.tap"

      - name: Upload coverage (lcov)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore

      - name: Smoke-check studio HTML is parseable
        run: |
          node -e "const fs=require('fs');const html=fs.readFileSync('studio/index.html','utf8');if(!html.includes('</html>'))process.exit(1);console.log('studio html ok ('+html.length+' bytes)')"

      # The end of this log (tools/tap-summary.mjs): the totals, every
      # failure with its place and error, annotations; no win32 skip here.
      - name: Test summary (the end of this log)
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        run: node tools/tap-summary.mjs "$RUNNER_TEMP/test.tap" --win32-skips 0

  # The Node floor. package.json engines says >=22.16.0 (node:sqlite, the
  # embedded store — docs/STORE_PLAN.md §1), and `node-version: '22'`
  # above resolves to the latest 22.x, which would never exercise the
  # floor: code could lean on a later 22.x API or fix and still pass.
  # This leg runs the suite on exactly the floor. It ends with the summary
  # (tools/tap-summary.mjs), and its run's shape is the reference
  # windows-vs-linux holds the Windows runs to.
  node-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test suites on the Node floor
        id: test
        shell: bash
        timeout-minutes: 7
        run: npm test 2>&1 | tee "$RUNNER_TEMP/test.tap"

      - name: Test summary (the end of this log)
        id: summary
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        run: node tools/tap-summary.mjs "$RUNNER_TEMP/test.tap" --win32-skips 0 --shape "$RUNNER_TEMP/run-shape.json"

      - name: Keep the run's shape for windows-vs-linux
        if: ${{ !cancelled() && steps.summary.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: run-shape-node-floor
          path: ${{ runner.temp }}/run-shape.json
          retention-days: 7
          overwrite: true

  # Windows (README "Platforms", docs/DOWNSTREAM.md §13): the suites on
  # windows-latest, on the Node floor and the latest 22. No fetch-validators
  # (test-backend-validate prints SKIPPED, as on node-floor), no docker, no
  # Playwright (the browser tests skip, as on every leg). The TAP goes to
  # the log and to a file; the summary step prints the block the log API's
  # tail reaches, annotates each failure, and fails the job unless the run
  # printed the SKIP win32: count README states. The run's shape goes to
  # windows-vs-linux, which holds it to the Linux floor's.
  windows:
    name: windows (node ${{ matrix.node }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: ['22.16.0', '22']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The report command docs/DOWNSTREAM.md §13 gives a Windows user, run
      # as written from Windows PowerShell on one suite: it must capture TAP.
      - name: The documented report command captures TAP
        shell: powershell
        run: |
          cmd /c "set NODE_OPTIONS=--test-reporter=tap&& npm run test:platform > test.tap 2>&1"
          if ($LASTEXITCODE) { Get-Content test.tap -Tail 40; exit $LASTEXITCODE }
          node tools/tap-summary.mjs test.tap --win32-skips 0
          $code = $LASTEXITCODE; Remove-Item test.tap; exit $code

      - name: Test suites on Windows
        id: test
        timeout-minutes: 35
        run: npm test 2>&1 | tee "$RUNNER_TEMP/test.tap"

      - name: Test summary (the end of this log)
        id: summary
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        run: node tools/tap-summary.mjs "$RUNNER_TEMP/test.tap" --win32-skips readme --shape "$RUNNER_TEMP/run-shape.json"

      - name: Keep the run's shape for windows-vs-linux
        if: ${{ !cancelled() && steps.summary.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: run-shape-windows-${{ matrix.node }}
          path: ${{ runner.temp }}/run-shape.json
          retention-days: 7
          overwrite: true

  # Windows ran what Linux ran: the same tests, the same harness assertions
  # per file (fewer only under a counted win32 skip), the same skip reasons
  # (tools/tap-summary.mjs --compare; README "Platforms").
  windows-vs-linux:
    needs: [node-floor, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'

      - uses: actions/download-artifact@v8
        with:
          pattern: run-shape-*
          path: ${{ runner.temp }}/shapes

      - name: The Windows runs against the Linux floor
        run: >-
          node tools/tap-summary.mjs --compare
          "$RUNNER_TEMP/shapes/run-shape-node-floor/run-shape.json"
          "$RUNNER_TEMP/shapes/run-shape-windows-22.16.0/run-shape.json"
          "$RUNNER_TEMP/shapes/run-shape-windows-22/run-shape.json"

  # T4 — the product-story round trip against a REAL Grafana:
  # compile → deploy-bulk (real MCP path) → fetch-live → diff → aligned.
  # Separate job: needs docker; the validate job stays fast.
  backend-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # pulls Grafana 12.4.4 + 13.0.2 images cold
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Round trip vs live Grafana (strict)
        run: npm run test:backend:live:strict

  # The Export gate against a REAL pre-store build (docs/STORE_PLAN.md §8):
  # tag v0.4.0 (auth and tenancy byte-identical to develop before slice 2)
  # in a worktree with its own npm ci, booted over HTTP on workspaces this
  # build exported in place. The fast half runs in `npm test`
  # (server/test-store-ops.mjs over server/fixtures/pre-store-build.mjs).
  store-prestore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check out the pre-store build (v0.4.0)
        run: |
          git fetch --depth 1 origin tag v0.4.0
          git worktree add "$RUNNER_TEMP/prestore" v0.4.0
          cd "$RUNNER_TEMP/prestore" && npm ci

      - name: Export gate vs the pre-store build (strict)
        run: npm run test:store:prestore:strict
        env:
          PRESTORE_BUILD_DIR: ${{ runner.temp }}/prestore
