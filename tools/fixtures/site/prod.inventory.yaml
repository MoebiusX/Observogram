# gen-site test fixture: a production environment in its own file. The file-level `env`
# applies to every host and queue manager below that does not declare its own.
inventory: v1
env: prod
pack: fixture.pack.yaml
environments:
  prod:
    scrape_interval: 30s
    vantage: dual
    profile: non-container
    endpoints:
      remote_write: https://mimir.prod.internal/api/v1/push
      loki: https://loki.prod.internal/otlp
      tempo: tempo.prod.internal:4317
      alertmanager: https://am.prod.internal
      alert_sink: http://alert-sink.mq-obs.svc:9095
      otlp: http://otel-gateway.mq-obs.svc:4318
      grafana: https://grafana.prod.internal
    receivers: { sev1: pagerduty://mq, sev2: "#mq-oncall", sev3: "#mq-team" }
    secrets: { pagerduty://mq: /etc/alertmanager/secrets/pagerduty_mq, "#mq-oncall": /etc/alertmanager/secrets/msteams_mq_oncall, "#mq-team": /etc/alertmanager/secrets/msteams_mq_team }
    repo_url: https://github.com/example/fixture/blob/main
    params:
      queue_pattern: "ORD\\..*|PAY\\..*"
      monitoring_host: mon1.prod.internal
      exporter_poll_interval: 30s
hosts:
  - { name: mqha1.prod.internal, site: dc1, roles: [rdqm-ha] }
  - { name: mqha2.prod.internal, site: dc1, roles: [rdqm-ha] }
  - { name: mqha3.prod.internal, site: dc1, roles: [rdqm-ha] }
  - { name: mqpay1.prod.internal, site: dc2, roles: [standalone] }
queue_managers:
  - name: QMORD1
    shape: rdqm-ha
    hosts: [ mqha1.prod.internal, mqha2.prod.internal, mqha3.prod.internal ]
    address: { host: 10.20.5.11, port: 1414 }
    params: { native_port: 9157, client_port: 9161 }
  - name: QMPAY1
    shape: host
    hosts: [ mqpay1.prod.internal ]
    address: { host: mqpay1.prod.internal, port: 1415 }
    params: { native_port: 9157, client_port: 9162 }
