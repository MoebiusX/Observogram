apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "shop.fullname" . }}-dashboards
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Shop Ops"
data:
  shop-overview.json: |-
    { "uid": "shop-overview", "title": "Shop overview", "schemaVersion": 39, "panels": [] }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "shop.fullname" . }}-node-dashboards
  labels:
    grafana_dashboard: "1"
  annotations:
    k8s-sidecar-target-directory: /tmp/dashboards/Platform
data:
{{ (.Files.Glob "dashboards/*.json").AsConfig | indent 2 }}
