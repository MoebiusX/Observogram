apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hostile.fullname" . }}-dashboards
  labels:
    grafana_dashboard: "1"
data:
  helm-ops.json: |
    {
      "uid": "helm-ops",
      "title": "Helm Ops",
      "version": 2,
      "panels": [
        {
          "title": "Ops",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(rate(http_requests_total[5m]))"
            }
          ]
        }
      ]
    }
