global:
  useObjectStatus: true
  useResetQStats: false
  usePublications: true
  logLevel: INFO
  pollInterval: 30s
  rediscoverInterval: 1h
connection:
  queueManager: QM1
  clientConnection: true
  user: ""
  replyQueue: SYSTEM.DEFAULT.MODEL.QUEUE
objects:
  queues:
    - "APP.*"
    - "!SYSTEM.*"
  channels:
    - "TO.*"
  topics:
  subscriptions:
  showInactiveChannels: false
prometheus:
  port: 9157
  metricsPath: /metrics
  namespace: ibmmq
