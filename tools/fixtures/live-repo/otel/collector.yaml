receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  resource:
    attributes:
      - key: service.namespace
        value: shop
        action: upsert

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
  otlp/traces:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlp/traces]
