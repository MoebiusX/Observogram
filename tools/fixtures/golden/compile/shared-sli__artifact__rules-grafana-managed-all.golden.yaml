        annotations:
          summary: shared-sli assurance watchdog — always firing
          description: "Dead-man contract for pack shared-sli: this alert fires continuously by construction. Route alertname=\"Watchdog\", pack=\"shared-sli\" to a heartbeat receiver and page when the heartbeat STOPS — silence means the ruler, Alertmanager or the notification path is down. Until a heartbeat route is added at deploy time it falls to the compiled Alertmanager's null receiver."
