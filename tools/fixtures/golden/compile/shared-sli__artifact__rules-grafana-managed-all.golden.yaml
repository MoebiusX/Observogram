            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params:
                      - 0
        no_data_state: OK
        exec_err_state: Error
        for: 15m
        labels:
          severity: SEV2
          slo: lat_99
          kind: forecast
          service: shared-sli
          sli: lat
          pack: shared-sli
        annotations:
          summary: lat_99 has burned faster than its budget for 2h and its 1d trend projects a breach within 1d
          method: linear on the 1h burn rate
          on_projected_breach: open_ticket
          horizon: 1d
          horizon_declared: 7d
        is_paused: false
