    name: shared_sli_recording
    folder: observability-pack
    interval: 30s
    rules:
      - uid: rec-shared_sli-lat-value_5m-slo-lat_99
        title: shared_sli:lat:value_5m{slo="lat_99"}
        condition: A
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: ${DS_PROMETHEUS}
            model:
              refId: A
              expr: histogram_quantile(0.99, sum(rate(http_server_request_duration_seconds_bucket{service_name="shared-sli"}[5m])) by (le))
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
        no_data_state: OK
        exec_err_state: Error
        for: 0s
        labels:
          slo: lat_99
          sli: lat
          service: shared-sli
        annotations: {}
        record:
          metric: shared_sli:lat:value_5m
          from: A
        is_paused: false
