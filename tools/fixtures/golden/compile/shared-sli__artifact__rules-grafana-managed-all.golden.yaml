          instrument: ruler/prometheus
          service: shared-sli
          pack: shared-sli
        annotations:
          summary: prometheus ruler instrument silent for shared-sli
          description: "prometheus_rule_group_last_evaluation_timestamp_seconds has not been scraped for 5m (10m sustained): the prometheus ruler that evaluates shared-sli's rules is not exposing itself — stopped, unscraped or renamed. Its rules are unproven while this fires. (Stack self-metric row rule_evaluation_staleness.)"
