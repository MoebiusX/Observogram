  - orgId: 1
    name: shared_sli_lat_99_burn
    folder: observability-pack
    interval: 30s
    rules:
      - uid: alr-lat_99_burn_14x_5m_1h
        title: lat_99_burn_14x_5m_1h
        condition: B
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: ${DS_PROMETHEUS}
            model:
              refId: A
              expr: |
                (
                  (sum_over_time((max(shared_sli:lat:value_5m) > bool 0.5)[5m:30s]) / 10) > 0.14
                ) and (
                  (sum_over_time((max(shared_sli:lat:value_5m) > bool 0.5)[1h:30s]) / 120) > 0.14
                ) and (
                  sum_over_time((max(shared_sli:lat:value_5m) > bool 0.5)[5m:30s]) >= 2
                )
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            queryType: ''
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params:
                      - 0
        no_data_state: OK
        exec_err_state: Error
        for: 2m
        labels:
          severity: SEV1
          slo: lat_99
          sli: lat
          service: shared-sli
          burn_rate: "14"
          window_short: 5m
          window_long: 1h
          pack: shared-sli
        annotations:
          summary: Burn rate 14× on lat_99
          description: Both the 5m and 1h error ratios exceed 14× of the 1.000% error budget for lat_99, with at least 2 bad samples in the 5m window.
          slo_objective: 99.000%
          slo_window: 30d
          runbook: (supply runbook URL)
        is_paused: false
