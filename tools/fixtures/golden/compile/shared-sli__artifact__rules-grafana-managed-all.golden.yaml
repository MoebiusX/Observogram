  - orgId: 1
    name: shared_sli_forecast
    folder: observability-pack
    interval: 5m
    rules:
      - uid: alr-lat_99_forecast_breach
        title: lat_99_forecast_breach
        condition: B
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: ${DS_PROMETHEUS}
            model:
              refId: A
              expr: predict_linear(shared_sli:errorbudget:burn_1h{slo="lat_99"}[1d], 86400) > 1 and min_over_time(shared_sli:errorbudget:burn_1h{slo="lat_99"}[2h]) > 1
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
