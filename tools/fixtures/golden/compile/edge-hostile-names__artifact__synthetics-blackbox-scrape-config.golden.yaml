    metrics_path: /probe
    scrape_interval: 1m
    scrape_timeout: 10s
    params:
      module:
        - hostile-health-canary
    static_configs:
      -
        targets:
          - https://demo.example.com/health?q=a&b=c
        labels:
          service: edge-hostile-names
          check: hostile-health-canary
    relabel_configs:
      -
        source_labels:
          - __address__
        target_label: __param_target
      -
        source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
