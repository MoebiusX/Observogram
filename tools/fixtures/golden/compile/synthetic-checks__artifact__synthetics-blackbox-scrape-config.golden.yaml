# Prometheus scrape jobs for the blackbox exporter compiled from ObservabilityPack v1.4
# Pack: synthetic-checks · version 0.1.0
# Source of truth — DO NOT hand-edit. Re-emit from the pack.
# Generated by tools/lib/blackbox.mjs (scrape_configs)
#
# Paste under `scrape_configs:` of prometheus.yml, or under the prometheus receiver's config in the collector file.
# The exporter is reached at blackbox-exporter:9115 (opts.blackboxAddress to change it); each job names the probed address as `instance`,
# so probe_success{instance="<address>"} is the series the rules and dashboards read.
#
# 7 modules, one per synthetic check of kind blackbox-exporter, named by the check id.
# The scrape job that drives each one passes module=<id>&target=<address> to blackbox-exporter:9115/probe
# (the synthetics/scrape-config artifact); the probed address is its `instance` label.
# What a module cannot enforce is named under its check: latency and certificate horizons are rules on the probe series.
#
# api-canary · http · https://api.example.com/health · every 1m · timeout 10s · SEV2
#   status 200 · body must match "\"status\":\"ok\""
#   latency_lt 500ms → not a module setting; a rule: probe_duration_seconds{instance="https://api.example.com/health"} > 0.5
#   otel_instrumentation: true → not honoured: the blackbox exporter does not propagate traceparent
# tls-horizon · http · https://api.example.com/ · every 10m · timeout 10s · SEV3
#   TLS required
#   tls_expiry_gt 14d → TLS is required by the module; the horizon is a rule: probe_ssl_earliest_cert_expiry{instance="https://api.example.com/"} - time() < 1209600
# login-body · http · http://api.example.com/login?next=/home&lang=en · every 30s · timeout 10s · SEV3
#   status 200|204 · body must match "build [0-9]+" · body must not match "maintenance \\(planned\\)"
# db-port · tcp · db.example.internal:5432 · every 1m · timeout 10s · SEV2
#   latency_lt 100ms → not a module setting; a rule: probe_duration_seconds{instance="db.example.internal:5432"} > 0.1
#   body_contains "ready" → not applicable to the tcp prober
# grpc-health · grpc · grpc.example.internal:9090 · every 1m · timeout 10s · SEV3
# gateway-ping · icmp · gw.example.internal · every 5s · timeout 5s · SEV3
# odd-assertion · http · https://api.example.com/odd · every 1m · timeout 10s · SEV3
#   status_code "2xx" → not expressible: valid_status_codes takes integer codes
#   header_present "X-Request-Id" → no blackbox module setting; left to a rule or to review
#
# Not compiled:
#   template-target · the target is not a URL, a host:port or a host the blackbox exporter can probe
#   journey-elastic · declared for elastic-synthetics — its engine of record, not the blackbox exporter
scrape_configs:
  - job_name: blackbox-api-canary
    metrics_path: /probe
    scrape_interval: 1m
    scrape_timeout: 10s
    params:
      module:
        - api-canary
    static_configs:
      -
        targets:
          - https://api.example.com/health
        labels:
          service: synthetic-checks
          check: api-canary
    relabel_configs:
      -
        source_labels:
          - __address__
        target_label: __param_target
      -
        source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
  - job_name: blackbox-tls-horizon
