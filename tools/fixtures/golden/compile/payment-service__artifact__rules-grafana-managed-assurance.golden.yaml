# Grafana-managed rules — assurance compiled from ObservabilityPack v1.3
# Pack: payment-service · version 1.5.0
# Format: Grafana 9+ provisioning YAML (apiVersion: 1).
# Apply via: copy under provisioning/alerting/ OR POST to /api/v1/provisioning/alert-rules
# Source of truth — DO NOT hand-edit. Re-emit from the pack.
apiVersion: 1
groups:
  - orgId: 1
    name: payment_service_assurance
    folder: observability-pack
    interval: 30s
    rules:
      - uid: alr-payment_service_watchdog
        title: Watchdog
        condition: B
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: ${DS_PROMETHEUS}
            model:
              refId: A
              expr: vector(1)
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            queryType: ''
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params:
                      - 0
        no_data_state: OK
        exec_err_state: Error
        for: 0s
        labels:
          severity: none
          kind: assurance
          instrument: watchdog
          service: payment-service
          pack: payment-service
        annotations:
          summary: payment-service assurance watchdog — always firing
          description: "Dead-man contract for pack payment-service: this alert fires continuously by construction. Route alertname=\"Watchdog\", pack=\"payment-service\" to a heartbeat receiver and page when the heartbeat STOPS — silence means the ruler, Alertmanager or the notification path is down. Until a heartbeat route is added at deploy time it falls to the compiled Alertmanager's null receiver."
          runbook: (supply runbook URL)
        is_paused: false
      - uid: alr-payment_service_scrape_target_down
        title: payment_service_scrape_target_down
        condition: B
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: ${DS_PROMETHEUS}
            model:
              refId: A
              expr: up{job=~"payment-api"} == 0
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            queryType: ''
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params:
                      - 0
        no_data_state: OK
        exec_err_state: Error
        for: 2m
        labels:
          severity: SEV2
          kind: assurance
          instrument: scrape
          service: payment-service
          pack: payment-service
        annotations:
          summary: A declared scrape target of payment-service is down
          description: "up == 0 for {{ $labels.job }}/{{ $labels.instance }} for 2m. The pack declares scrape job(s) payment-api: every SLI, recording rule and burn alert of payment-service reading them is blind while this fires."
          runbook: (supply runbook URL)
        is_paused: false
      - uid: alr-payment_service_ruler_silent-0vzlf0n
        title: payment_service_ruler_silent_prometheus
        condition: B
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: ${DS_PROMETHEUS}
            model:
              refId: A
              expr: absent_over_time(prometheus_rule_group_last_evaluation_timestamp_seconds[5m])
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            queryType: ''
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params:
                      - 0
        no_data_state: OK
        exec_err_state: Error
        for: 10m
        labels:
          severity: SEV2
          kind: assurance
          instrument: ruler/prometheus
          service: payment-service
          pack: payment-service
        annotations:
          summary: prometheus ruler instrument silent for payment-service
          description: "prometheus_rule_group_last_evaluation_timestamp_seconds has not been scraped for 5m (10m sustained): the prometheus ruler that evaluates payment-service's rules is not exposing itself — stopped, unscraped or renamed. Its rules are unproven while this fires. (Stack self-metric row rule_evaluation_staleness.)"
          runbook: (supply runbook URL)
        is_paused: false
      - uid: alr-payment_service_notify_silen-0qcogte
        title: payment_service_notify_silent_prometheus
        condition: B
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: ${DS_PROMETHEUS}
            model:
              refId: A
              expr: absent_over_time(prometheus_notifications_sent_total[5m])
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            queryType: ''
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params:
                      - 0
        no_data_state: OK
        exec_err_state: Error
        for: 10m
        labels:
          severity: SEV2
          kind: assurance
          instrument: notify/prometheus
          service: payment-service
          pack: payment-service
        annotations:
          summary: prometheus notify instrument silent for payment-service
          description: "prometheus_notifications_sent_total has not been scraped for 5m (10m sustained): the prometheus notify that delivers payment-service's rules is not exposing itself — stopped, unscraped or renamed. Its rules are unproven while this fires. (Stack self-metric row notifications_sent.)"
          runbook: (supply runbook URL)
        is_paused: false
      - uid: alr-payment_service_ruler_stale_-0a8mra5
        title: payment_service_ruler_stale_prometheus
        condition: B
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: ${DS_PROMETHEUS}
            model:
              refId: A
              expr: max(time() - prometheus_rule_group_last_evaluation_timestamp_seconds) > 120
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            queryType: ''
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params:
                      - 0
        no_data_state: OK
        exec_err_state: Error
        for: 2m
        labels:
          severity: SEV3
          kind: assurance
          instrument: ruler/prometheus
          service: payment-service
          pack: payment-service
        annotations:
          summary: prometheus rule evaluation stale for payment-service
          description: "The newest rule-group evaluation is older than 120s for 2m: payment-service's recording rules and burn alerts are being evaluated late. Caveat: a fully stopped ruler cannot evaluate this alert — the Watchdog covers that case. (Stack self-metric row rule_evaluation_staleness.)"
          runbook: (supply runbook URL)
        is_paused: false
      - uid: alr-payment_service_ruler_errors-1jh2edl
        title: payment_service_ruler_errors_prometheus
        condition: B
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: ${DS_PROMETHEUS}
            model:
              refId: A
              expr: increase(prometheus_rule_evaluation_failures_total[5m]) > 0
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            queryType: ''
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params:
                      - 0
        no_data_state: OK
        exec_err_state: Error
        for: 2m
        labels:
          severity: SEV3
          kind: assurance
          instrument: ruler/prometheus
          service: payment-service
          pack: payment-service
        annotations:
          summary: prometheus rule evaluation errors for payment-service
          description: "prometheus_rule_evaluation_failures_total increased in the last 5m for 2m: some of payment-service's rules fail to evaluate — a failing rule records nothing and its burn alert can never fire. (Stack self-metric row rule_evaluation_failures.)"
          runbook: (supply runbook URL)
        is_paused: false
      - uid: alr-payment_service_notify_error-1r64qlw
        title: payment_service_notify_errors_prometheus
        condition: B
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: ${DS_PROMETHEUS}
            model:
              refId: A
              expr: increase(prometheus_notifications_errors_total[5m]) > 0
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            queryType: ''
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params:
                      - 0
        no_data_state: OK
        exec_err_state: Error
        for: 2m
        labels:
          severity: SEV3
          kind: assurance
          instrument: notify/prometheus
          service: payment-service
          pack: payment-service
        annotations:
          summary: prometheus notification errors for payment-service
          description: "prometheus_notifications_errors_total increased in the last 5m for 2m: prometheus failed to deliver notifications — payment-service's alerts may fire unseen. (Stack self-metric row notification_errors.)"
          runbook: (supply runbook URL)
        is_paused: false
