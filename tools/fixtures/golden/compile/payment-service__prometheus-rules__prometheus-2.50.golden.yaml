        annotations:
          summary: api_availability_99_9 has burned faster than its budget for 2h and its 1d trend projects a breach within 1d
          method: linear on the 1h burn rate (pack declares holt-winters)
          on_projected_breach: open_ticket
          horizon: 1d
          horizon_declared: 7d
