apiVersion: observability.platform/v1
kind: ObservabilityPack
metadata:
  name: orders-kafka
  version: 0.1.0
  binding: otel-grafanalabs
  owners:
    - orders-kafka-owners
  imports:
    - ref: platform/std-budget-policy@2.1
  bindings:
    service: orders-kafka
    environments:
      - prod
    criticality: tier-2
  labels:
    source: library
    tier: tier-2
    library.entries: kafka
  annotations:
    library.source: kafka@1.0.0
    library.format: v1
    library.tier: tier-2
    library.environment: prod
    library.toggles: slos,policy,routes,dashboards,validation
    library.slis: broker_availability,consumer_group_lag_seconds,partition_replica_health,produce_latency_p99,fetch_latency_p99
    library.params: "{}"
    library.evidence: kafka:recorded-live
    library.evidence.slis.broker_availability: "recorded-live: kafka.md §1.4 — up{job=\"kafka-broker\"} = 1 on the lab (one target)"
    library.evidence.slis.consumer_group_lag_seconds: "recorded-live: kafka.md §1.3-1.4 — kafka_exporter 1.10.0 families and the expression executed (two consumer groups)"
    library.evidence.slis.partition_replica_health: "recorded-live: kafka.md §1.3-1.4 — both families present and the bool form executed; an ISR shortfall itself was not observable on RF 1 (§1.6)"
    library.evidence.slis.produce_latency_p99: "recorded-live: kafka.md §1.2, §1.4 — kafka_network_requestmetrics_totaltimems{request=\"Produce\",quantile=\"0.99\"} read from the JMX exposition and the expression executed"
    library.evidence.slis.fetch_latency_p99: "recorded-live: kafka.md §1.2, §1.4 — the LocalTimeMs quantile gauge and the expression executed; the TotalTimeMs trap measured"
    library.todoCount: "19"
    library.todo.alerting.routes[0]: "channels.0.msteams: Chat channel for SEV1/SEV2: placeholder '#orders-kafka-oncall' (param oncall_channel) — The Teams channel the SEV1 and SEV2 routes post to. · channels.1.voice: Voice (pager) target for SEV1: placeholder 'pagerduty://orders-kafka' (param pager_service) — The voice channel of the SEV1 route (tier-2 and tier-1; L4.MUST.tier1_voice_route)."
    library.todo.alerting.routes[1]: "channels.0.msteams: Chat channel for SEV1/SEV2: placeholder '#orders-kafka-oncall' (param oncall_channel) — The Teams channel the SEV1 and SEV2 routes post to."
    library.todo.alerting.routes[2]: "channels.0.msteams: Chat channel for SEV3: placeholder '#orders-kafka-team' (param team_channel) — The Teams channel the SEV3 route posts to."
    library.todo.baselines: "mttd_target_p50: MTTD / MTTR targets are the tier-2 defaults, not measured: set them from the service's incident history"
    library.todo.metadata.owners: "owners defaulted to 'orders-kafka-owners': name the owning team(s)"
    library.todo.pipelines.exporters.logs: "endpoints.0: Loki OTLP ingest endpoint: placeholder 'http://loki:3100/otlp' (param logs_otlp_endpoint) — Where the collector pushes logs over OTLP/HTTP (pipelines.exporters.logs)."
    library.todo.pipelines.exporters.metrics: "endpoint: Prometheus remote-write URL: placeholder 'http://prometheus:9090/api/v1/write' (param remote_write_url) — Where the collector remote-writes metrics (pipelines.exporters.metrics)."
    library.todo.pipelines.exporters.traces: "endpoint: Tempo OTLP ingest endpoint: placeholder 'tempo:4317' (param traces_otlp_endpoint) — Where the collector pushes traces over OTLP/gRPC (pipelines.exporters.traces)."
    library.todo.pipelines.receivers[1]: "scrape_configs.0.static_configs.0.targets.0: Broker JMX exporter targets: placeholder 'kafka-broker.kafka:9404' (param broker_targets) — host:port of every broker's JMX Prometheus exporter (comma-separated in the scrape config). · scrape_configs.1.static_configs.0.targets.0: kafka_exporter target: placeholder 'kafka-exporter.kafka:9308' (param exporter_target) — host:port of kafka_exporter."
    library.todo.remediation[0]: "runbook: write the runbook file://<runbook_dir>/broker-down.md"
    library.todo.remediation[1]: "runbook: write the runbook file://<runbook_dir>/under-replicated-partitions.md"
    library.todo.storage.metrics: "remote_write.0.url: Prometheus remote-write URL: placeholder 'http://prometheus:9090/api/v1/write' (param remote_write_url) — Where the collector remote-writes metrics (pipelines.exporters.metrics)."
    library.todo.telemetry.backends.logs-loki: "endpoints.0: Loki endpoint: placeholder 'http://loki:3100' (param logs_endpoint) — Where the logs backend answers (telemetry.backends logs-loki)."
    library.todo.telemetry.backends.metrics-prom: "endpoints.0: Prometheus query endpoint: placeholder 'http://prometheus:9090' (param metrics_endpoint) — Where the metrics backend answers PromQL (telemetry.backends metrics-prom)."
    library.todo.telemetry.backends.traces-tempo: "endpoints.0: Tempo endpoint: placeholder 'http://tempo:3200' (param traces_endpoint) — Where the traces backend answers (telemetry.backends traces-tempo)."
    library.todo.validation.chaos_experiments.broker-network-partition: "target: Broker workload (chaos target): placeholder 'kafka-broker' (param broker_workload) — The broker workload (StatefulSet / pods) the chaos experiments target."
    library.todo.validation.chaos_experiments.broker-pod-kill: "target: Broker workload (chaos target): placeholder 'kafka-broker' (param broker_workload) — The broker workload (StatefulSet / pods) the chaos experiments target."
    library.todo.validation.synthetic_checks.consumer-group-health: "target: Bootstrap servers: placeholder 'kafka.kafka:9092' (param bootstrap) — The bootstrap address the synthetic produce/consume canary connects to."
    library.todo.validation.synthetic_checks.produce-consume-canary: "target: Bootstrap servers: placeholder 'kafka.kafka:9092' (param bootstrap) — The bootstrap address the synthetic produce/consume canary connects to."
spec:
  otel:
    semconv: 1.27.0
    resource_attributes:
      required:
        - service.name
        - service.namespace
        - service.version
        - deployment.environment
      custom:
        - kafka.cluster.id
        - kafka.broker.id
    sdk:
      languages:
        - java
        - go
        - node
      sampling:
        policy: parentbased_traceidratio
        ratio: 0.1
      propagators:
        - tracecontext
        - baggage
      log_correlation: true
  telemetry:
    backends:
      - id: metrics-prom
        signal: metrics
        product: prometheus
        version:
          declared: "3.14"
          min: "2.53"
          gating: warn
        endpoints:
          - http://prometheus:9090
        default: true
      - id: logs-loki
        signal: logs
        product: loki
        version:
          declared: "3.7"
          min: "3.0"
          gating: warn
        endpoints:
          - http://loki:3100
        default: true
      - id: traces-tempo
        signal: traces
        product: tempo
        version:
          declared: "2.10"
          min: "2.5"
          gating: warn
        endpoints:
          - http://tempo:3200
        default: true
  environments:
    prod:
      criticality: tier-2
      backends:
        metrics: metrics-prom
        logs: logs-loki
        traces: traces-tempo
  slis:
    - id: broker_availability
      type: ratio
      description: Fraction of brokers reporting ready vs. the cluster's declared broker count.
      semconv_metric: kafka.broker.up
      good: sum(up{job="kafka-broker"} == bool 1)
      total: count(up{job="kafka-broker"})
    - id: consumer_group_lag_seconds
      type: threshold
      description: Maximum consumer-group lag in seconds equivalent, per consumer group (message-count lag over the group's rolling consumption rate).
      semconv_metric: messaging.kafka.consumer.lag
      query: |
        max by (consumergroup) (
          kafka_consumergroup_lag /
            (rate(kafka_consumergroup_current_offset[5m]) > 0)
        )
      threshold: 60
      unit: seconds
    - id: partition_replica_health
      type: ratio
      description: Fraction of partitions whose in-sync replica count equals their replica count (== bool, one per healthy partition).
      semconv_metric: kafka.partition.in_sync_replicas
      good: sum(kafka_topic_partition_in_sync_replica == bool kafka_topic_partition_replicas)
      total: count(kafka_topic_partition_replicas)
    - id: produce_latency_p99
      type: threshold
      description: 99th-percentile total time of Produce requests on the broker, in seconds (queue, local, replication wait, response send) — what a producer waits for an ack.
      semconv_metric: kafka.broker.request.latency
      query: max(kafka_network_requestmetrics_totaltimems{request="Produce",quantile="0.99"}) / 1000
      threshold: 0.1
      unit: seconds
    - id: fetch_latency_p99
      type: threshold
      description: 99th-percentile local (broker processing) time of FetchConsumer requests, in seconds.
      semconv_metric: kafka.broker.request.latency
      query: max(kafka_network_requestmetrics_localtimems{request="FetchConsumer",quantile="0.99"}) / 1000
      threshold: 0.05
      unit: seconds
  slos:
    - id: broker_availability_99_9
      sli: broker_availability
      objective: 0.999
      window: 30d
      error_budget_policy: ref:platform/std-budget-policy
    - id: consumer_group_lag_seconds_99
      sli: consumer_group_lag_seconds
      objective: 0.99
      window: 7d
      error_budget_policy: ref:platform/std-budget-policy
    - id: partition_replica_health_99_95
      sli: partition_replica_health
      objective: 0.9995
      window: 30d
      error_budget_policy: ref:platform/std-budget-policy
    - id: produce_latency_p99_99
      sli: produce_latency_p99
      objective: 0.99
      window: 30d
      error_budget_policy: ref:platform/std-budget-policy
    - id: fetch_latency_p99_99
      sli: fetch_latency_p99
      objective: 0.99
      window: 30d
      error_budget_policy: ref:platform/std-budget-policy
  pipelines:
    receivers:
      - name: otlp
        protocols:
          - grpc
          - http
        endpoint: 0.0.0.0:4317
      - name: prometheus
        scrape_configs:
          - job_name: kafka-broker
            scrape_interval: 30s
            static_configs:
              -
                targets:
                  - kafka-broker.kafka:9404
          - job_name: kafka-exporter
            scrape_interval: 30s
            static_configs:
              -
                targets:
                  - kafka-exporter.kafka:9308
    processors:
      - name: memory_limiter
        limit_percentage: 80
      - name: batch
        timeout: 10s
      - name: resource
        attributes:
          - key: deployment.environment
            value: prod
            action: upsert
    exporters:
      metrics:
        kind: prometheusremotewrite
        endpoint: http://prometheus:9090/api/v1/write
        external_labels:
          service: orders-kafka
      logs:
        kind: otlphttp
        endpoints:
          - http://loki:3100/otlp
      traces:
        kind: otlp
        endpoint: tempo:4317
  storage:
    metrics:
      backend: prometheus
      version: "3.14"
      retention: 90d
      remote_write:
        - url: http://prometheus:9090/api/v1/write
    logs:
      backend: loki
      version: "3.7"
      retention: 30d
    traces:
      backend: tempo
      version: "2.10"
      retention: 7d
      sampling: head-based
  queries:
    recording_rules:
      - name: orders_kafka:broker_availability:ratio_5m
        expr: ref:slis.broker_availability
        interval: 30s
      - name: orders_kafka:consumer_group_lag_seconds:value_5m
        expr: ref:slis.consumer_group_lag_seconds
        interval: 30s
      - name: orders_kafka:partition_replica_health:ratio_5m
        expr: ref:slis.partition_replica_health
        interval: 30s
      - name: orders_kafka:produce_latency_p99:value_5m
        expr: ref:slis.produce_latency_p99
        interval: 30s
      - name: orders_kafka:fetch_latency_p99:value_5m
        expr: ref:slis.fetch_latency_p99
        interval: 30s
    derived_views:
      - id: golden_signals_orders_kafka
        bind: ref:platform/golden-signals-view
        params:
          service: orders-kafka
      - id: per_topic_throughput
        bind: ref:platform/per-resource-rollup
        params:
          metric: kafka_server_brokertopicmetrics_messagesin_total{topic!=""}
          by:
            - topic
      - id: per_consumergroup_lag
        bind: ref:platform/per-resource-rollup
        params:
          sli: consumer_group_lag_seconds
          by:
            - consumergroup
  dashboards:
    - id: orders-kafka-overview
      provider:
        kind: grafana
        version: "12.4"
        schemaVersion: 41
      folder: orders-kafka
      source: file://dashboards/orders-kafka-overview.json
      panel_bindings:
        - panel: slis-broker-availability
          binds_to: slis.broker_availability
        - panel: slis-consumer-group-lag-seconds
          binds_to: slis.consumer_group_lag_seconds
        - panel: slis-partition-replica-health
          binds_to: slis.partition_replica_health
        - panel: slis-produce-latency-p99
          binds_to: slis.produce_latency_p99
        - panel: slis-fetch-latency-p99
          binds_to: slis.fetch_latency_p99
        - panel: slos-broker-availability-99-9
          binds_to: slos.broker_availability_99_9
        - panel: slos-consumer-group-lag-seconds-99
          binds_to: slos.consumer_group_lag_seconds_99
        - panel: slos-partition-replica-health-99-95
          binds_to: slos.partition_replica_health_99_95
        - panel: slos-produce-latency-p99-99
          binds_to: slos.produce_latency_p99_99
        - panel: slos-fetch-latency-p99-99
          binds_to: slos.fetch_latency_p99_99
    - id: orders-kafka-slo-burn
      provider:
        kind: grafana
        version: "12.4"
        schemaVersion: 41
      folder: orders-kafka
      template: ref:platform/slo-burn-template
      params:
        slos:
          - broker_availability_99_9
          - consumer_group_lag_seconds_99
          - partition_replica_health_99_95
          - produce_latency_p99_99
          - fetch_latency_p99_99
    - id: kafka-consumer-lag
      provider:
        kind: grafana
        version: "12.4"
        schemaVersion: 41
      folder: orders-kafka
      source: file://dashboards/kafka-consumer-lag.json
      panel_bindings:
        - panel: slis-consumer-group-lag-seconds
          binds_to: slis.consumer_group_lag_seconds
        - panel: slos-consumer-group-lag-seconds-99
          binds_to: slos.consumer_group_lag_seconds_99
        - panel: view-per-consumergroup-lag
          binds_to: ref:queries.per_consumergroup_lag
    - id: kafka-throughput
      provider:
        kind: grafana
        version: "12.4"
        schemaVersion: 41
      folder: orders-kafka
      source: file://dashboards/kafka-throughput.json
      panel_bindings:
        - panel: view-per-topic-throughput
          binds_to: ref:queries.per_topic_throughput
  policy:
    burn_rate_alerts:
      - slo: broker_availability_99_9
        windows:
          - short: 5m
            long: 1h
            factor: 14
            severity: SEV1
          - short: 30m
            long: 6h
            factor: 6
            severity: SEV2
      - slo: consumer_group_lag_seconds_99
        windows:
          - short: 10m
            long: 1h
            factor: 10
            severity: SEV2
          - short: 1h
            long: 6h
            factor: 4
            severity: SEV3
      - slo: partition_replica_health_99_95
        windows:
          - short: 5m
            long: 1h
            factor: 14
            severity: SEV1
          - short: 30m
            long: 6h
            factor: 6
            severity: SEV2
      - slo: produce_latency_p99_99
        windows:
          - short: 5m
            long: 1h
            factor: 14
            severity: SEV2
          - short: 30m
            long: 6h
            factor: 6
            severity: SEV3
      - slo: fetch_latency_p99_99
        windows:
          - short: 5m
            long: 1h
            factor: 14
            severity: SEV2
          - short: 30m
            long: 6h
            factor: 6
            severity: SEV3
  alerting:
    routes:
      - severity: SEV1
        channels:
          - msteams: "#orders-kafka-oncall"
          - voice: pagerduty://orders-kafka
      - severity: SEV2
        channels:
          - msteams: "#orders-kafka-oncall"
      - severity: SEV3
        channels:
          - msteams: "#orders-kafka-team"
    dedup: ref:platform/std-dedup
    suppress:
      - maintenance_windows
      - deploy_freezes
  remediation:
    - trigger: alert:kafka-broker-down
      runbook: file://runbooks/broker-down.md
      automation: argo-workflow://restart-broker-with-quorum-check
      guardrails:
        max_invocations_per_hour: 2
        requires_human_above: SEV1
        rollback_on_failure: true
        cooldown_after_success: 30m
        circuit_breaker:
          failures: 2
          window: 1h
    - trigger: alert:kafka-partition-under-replicated
      runbook: file://runbooks/under-replicated-partitions.md
      automation: argo-workflow://reassign-partitions-with-throttle
      guardrails:
        max_invocations_per_hour: 1
        requires_human_above: SEV2
        rollback_on_failure: false
        cooldown_after_success: 1h
  baselines:
    mttd_target_p50: 5m
    mttd_target_p95: 15m
    mttr_target_p50: 1h
    mttr_target_p95: 4h
    measurement_source: incident-mgmt + alertmanager firing timestamps
    review_cadence: monthly
    regression_gate: warn_only
  validation:
    synthetic_checks:
      - id: produce-consume-canary
        kind: k6
        target: kafka.kafka:9092
        interval: 1m
        assertions:
          - produce_success: true
          - round_trip_latency_lt: 500ms
        on_fail_severity: SEV2
      - id: consumer-group-health
        kind: k6
        target: kafka.kafka:9092
        interval: 1m
        assertions:
          - consumer_groups_assigned: true
          - current_offset_advancing: true
        on_fail_severity: SEV2
    chaos_experiments:
      - id: broker-pod-kill
        engine: chaos-mesh
        target: kafka-broker
        steady_state_hypothesis: ref:slos.broker_availability_99_9
        fault:
          kind: pod-failure
          fraction: 0.33
          duration: 90s
        expected_alerts:
          - broker_availability_99_9_burn_14x_5m_1h
        expected_mttd: 90s
        schedule: monthly
        environment: staging
      - id: broker-network-partition
        engine: chaos-mesh
        target: kafka-broker
        steady_state_hypothesis: ref:slos.partition_replica_health_99_95
        fault:
          kind: network-partition
          duration: 3m
        expected_alerts:
          - partition_replica_health_99_95_burn_14x_5m_1h
        expected_mttd: 2m
        schedule: monthly
        environment: staging
