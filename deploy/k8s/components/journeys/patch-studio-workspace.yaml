# Strategic-merge patch on the studio Deployment: mount the workspace PVC at
# /workspace and point OBSERVOGRAM_WORKSPACE at it. This is the other half of
# the prerequisite — the CronJob (cronjob-journeys.yaml) writes to exactly this
# path, so the Journeys view shows its runs. Without this patch the studio
# would keep its in-container workspace (ephemeral, and /app/.observogram is
# not even creatable by uid 1000) and never see a scheduled run. It also adds
# fsGroup 1000 to the pod: a new volume is root-owned until the kubelet
# applies the group.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observabilitypack-studio
spec:
  template:
    spec:
      # Merged into the base pod securityContext (runAsNonRoot/runAsUser/
      # runAsGroup stay): a freshly provisioned PVC is root:root 0755, so
      # without fsGroup uid 1000 cannot write runs/ — same values as the
      # CronJob (cronjob-journeys.yaml).
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: studio
          env:
            - name: OBSERVOGRAM_WORKSPACE
              value: /workspace
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: observabilitypack-studio-workspace
